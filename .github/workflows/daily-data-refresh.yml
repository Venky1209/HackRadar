name: Daily Data Refresh

# Fetches every source, writes data/hackathons.json, checks the site still builds, then
# commits. Vercel's GitHub integration deploys the commit, so no Vercel token is needed.
# The daily commit also keeps GitHub from disabling this schedule for inactivity.

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fetch sources
        run: node scripts/refresh.mjs

      - name: Check the site still builds
        run: |
          npm ci
          npm run build

      - name: Commit and push (Vercel redeploys on push)
        run: |
          git config user.name "hackradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hackathons.json data/refresh-report.json
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          count=$(node -e 'console.log(require("./data/hackathons.json").length)')
          git commit -m "data: daily refresh (${count} open events)"
          git push
